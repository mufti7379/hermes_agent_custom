# Hermes Agent (NousResearch) di VPS Oracle yang DIPAKAI BERSAMA proyek lain:
#   - banksampah-bsip-backend-FIX  → pemilik Caddy "caddy_ssl" (satu-satunya pemegang port 80/443)
#   - ResikforSchools-Api          → ikut di belakang caddy_ssl lewat jaringan bersama "proxy"
#
# Prinsip (sama dengan ResikforSchools-Api/deploy/README.md):
#   - name: hermes → container/jaringan/volume berawalan "hermes-", `docker compose down`
#     di folder ini tidak menyentuh proyek lain.
#   - TIDAK ADA `ports:`. Gateway cuma butuh koneksi KELUAR (API LLM + Telegram polling).
#     Docker mem-bypass ufw/iptables, jadi port yang dipublish = langsung terbuka ke internet.
#   - Gateway + dashboard SATU container: dashboard hanya bisa melihat status gateway kalau berbagi ruang
#     proses. Kalau dipisah, statusnya selalu "stopped" walaupun bot hidup.
#   - Hanya dijangkau caddy_ssl lewat jaringan KHUSUS "hermes-edge" (isinya cuma container ini dan caddy_ssl).
#     Sengaja bukan "proxy": di sana agent bisa memanggil banksampahku-api / banksampahku-web.
#   - JANGAN mount /var/run/docker.sock: agent yang bisa menjalankan perintah akan jadi
#     root di host → bisa membaca/menghapus database banksampah & ResikforSchools.
#
#   cp .env.example .env            # isi nilainya
#   docker compose up -d            # gateway + dashboard + 9router
name: hermes

services:
  gateway:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:stable}
    restart: unless-stopped
    command: ["gateway", "run"]
    volumes:
      # HERMES_HOME. Berisi .env (API key), config.yaml, memories/, sessions/, state.db
      - ./data:/opt/data
      # Kunci akses bot (managed/.env): menang atas data/.env dan read-only, jadi agent tidak bisa mengubahnya.
      # create_host_path: false → compose menolak start kalau folder managed/ belum dibuat.
      - type: bind
        source: ./managed
        target: /etc/hermes
        read_only: true
        bind:
          create_host_path: false
    environment:
      # Container start sebagai root lalu turun ke user ini; samakan dengan pemilik ./data
      HERMES_UID: ${HERMES_UID:?isi HERMES_UID di .env (hasil `id -u`)}
      HERMES_GID: ${HERMES_GID:?isi HERMES_GID di .env (hasil `id -g`)}
      TZ: Asia/Jakarta
      # Dashboard ikut jalan di container ini (port 9119, tidak dipublish ke host)
      HERMES_DASHBOARD: "1"
      # Dashboard menyimpan API key → WAJIB auth. Tanpa ini Hermes menolak menjalankan dashboard
      # (bind non-loopback tanpa auth = fail closed). Compose juga menolak start bila kosong.
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${DASHBOARD_USER:?isi DASHBOARD_USER di .env}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_PASSWORD:?isi DASHBOARD_PASSWORD di .env (openssl rand -hex 24)}
    # Siapa yang boleh chat: lihat managed/.env (bukan environment: di sini, karena data/.env menimpanya).
    # Batas sumber daya agar Hermes tidak merebut RAM/CPU dari MySQL banksampah
    # (innodb-buffer-pool 1200M) & PostgreSQL ResikforSchools. Sesuaikan di .env.
    mem_limit: ${HERMES_MEM_LIMIT:-3g}
    cpus: ${HERMES_CPUS:-1.0}
    shm_size: 1g # dibutuhkan Chromium bila tool browser dipakai
    logging:
      driver: json-file
      options:
        max-size: "10m" # disk VPS kecil: log tidak boleh tumbuh tanpa batas
        max-file: "3"
    networks:
      hermes-edge:
        aliases: [hermes-dashboard] # dipanggil Caddy: reverse_proxy hermes-dashboard:9119
      router: {} # jalur ke http://9router:20128/v1

  # Penghubung ke provider AI. Hermes memanggil http://9router:20128/v1 dengan API key buatan 9Router.
  # TIDAK ADA `ports:` → dashboard-nya dibuka lewat tunnel SSH saja (README 5c), jangan lewat Caddy.
  9router:
    image: decolua/9router:0.5.123
    restart: unless-stopped
    volumes:
      - ./router-data:/app/data # database: akun provider, API key, setting
    environment:
      DATA_DIR: /app/data
      TZ: Asia/Jakarta
      # Tanpa ini password login-nya "123456"
      INITIAL_PASSWORD: ${ROUTER_PASSWORD:?isi ROUTER_PASSWORD di .env (openssl rand -hex 24)}
      # Tanpa ini API key dibuat dengan kunci bawaan yang diketahui umum. Jangan diganti setelah dipakai.
      API_KEY_SECRET: ${ROUTER_API_KEY_SECRET:?isi ROUTER_API_KEY_SECRET di .env (openssl rand -hex 32)}
    mem_limit: 1g
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - router

networks:
  router: {} # hanya Hermes ↔ 9Router (punya akses keluar ke provider AI)
  hermes-edge:
    external: true # dibuat sekali: docker network create hermes-edge (README langkah 1)
